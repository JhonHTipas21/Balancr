name: Agent Evaluation (LangGraph)

on:
  pull_request:
    paths:
      - 'balancr/agent/**'
      - 'balancr/engine/**'
      - 'evals/**'
      - '.github/workflows/agent-eval.yml'

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest
    env:
      MIN_ACCURACY: "90.0"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found yet"
          pip install pydantic langgraph langchain-groq pytest

      - name: Cache Agent/LLM Responses
        uses: actions/cache@v4
        with:
          path: .langchain_cache
          key: agent-eval-${{ hashFiles('evals/golden_cases.json') }}
          restore-keys: |
            agent-eval-

      - name: Run Golden Cases Evaluation
        id: run_eval
        env:
          PYTHONPATH: .
        run: |
          python evals/run_eval.py
        continue-on-error: true # We want to post the comment even if it fails

      - name: Post PR Comment with Results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('eval_results.json')) {
              const results = JSON.parse(fs.readFileSync('eval_results.json', 'utf8'));
              
              let body = `## 🤖 Agent Evaluation Results\n\n`;
              body += `**Accuracy:** ${results.accuracy.toFixed(2)}%\n`;
              body += `**Threshold:** ${results.min_accuracy.toFixed(2)}%\n`;
              body += `**Status:** ${results.passed ? '✅ PASSED' : '❌ FAILED'}\n\n`;
              
              if (results.failures && results.failures.length > 0) {
                body += `### Failed Cases\n\n`;
                body += `| Case ID | Expected | Actual | Description |\n`;
                body += `|---------|----------|--------|-------------|\n`;
                results.failures.forEach(f => {
                  body += `| ${f.case_id} | \`${f.expected}\` | \`${f.actual}\` | ${f.description} |\n`;
                });
              } else {
                body += `🎉 All golden cases passed correctly!\n`;
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ Evaluation script failed to generate results artifact.`
              });
            }

      - name: Enforce Pass/Fail Status
        run: |
          if [ ! -f eval_results.json ]; then
            echo "eval_results.json missing"
            exit 1
          fi
          PASSED=$(jq -r '.passed' eval_results.json)
          if [ "$PASSED" != "true" ]; then
            echo "Evaluation failed threshold."
            exit 1
          fi
